<h1 class="text-3xl font-bold font-montserrat">
  All products
  <span class="text-accent">{{ gender() }}</span>
</h1>
<h2 class="text-xl mb-5">For all tastes!</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3">

  @for (product of productsResourse.value()?.products; track product.slug) {
    <product-card
      [product]="product" />
  }
  @empty {
    <p>No available products</p>
  }
</div>

<pagination
  [pages]="productsResourse.value()?.pages ?? 0"
  [currentPage]="paginationService.currentPage()" />
