<h1 class="text-2xl font-bold">Products list!</h1>
<h3 class="text-lg">Total: <span class="text-accent">
  {{ productsResourse.value()?.count }}
</span></h3>

<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
  <pagination
    [pages]="productsResourse.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()" />

    <select class="select select-bordered w-32"
      (change)="onProductsPerPageSelect(+selectPerPage.value)" #selectPerPage>
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

    <div class="flex flex-1"></div>

    <button
      class="btn btn-primary"
      [routerLink]="['/admin/products/new']">Create new</button>
</div>

<!-- List -->
<product-table [products]="productsResourse.value()?.products ?? []" />
