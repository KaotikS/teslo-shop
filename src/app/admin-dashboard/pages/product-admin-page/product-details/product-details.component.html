<h1 class="text-2xl font-bold">{{ product().title }}</h1>
<div class="divider"></div>

<form class="grid grid-cols-1 sm:grid-cols-2 gap-4"
  [formGroup]="detailsForm"
  (ngSubmit)="onSubmit()">
  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">Datos generales</h2>
    <input
      type="text"
      placeholder="Título"
      class="input input-bordered w-full"
      [value]="product().title"
      formControlName="title"
      [class.border-red-500]="detailsForm.get('title')?.errors ?? false"
    />
    <form-error-label [control]="detailsForm.get('title')!" />

    <input type="text" placeholder="Slug" class="input input-bordered w-full"
      [value]="product().id"
      formControlName="slug"
      [class.border-red-500]="detailsForm.get('slug')?.errors ?? false"
    />
    <form-error-label [control]="detailsForm.get('slug')!" />

    <textarea
      class="textarea textarea-bordered w-full"
      placeholder="Descripción"
      formControlName="description"
      [value]="product().description"
      rows="6"
      [class.border-red-500]="detailsForm.get('description')?.errors ?? false"></textarea>
    <form-error-label [control]="detailsForm.get('description')!" />

    <h2 class="text-lg font-bold">Datos de venta</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div>
        <input
          type="number"
          placeholder="Precio"
          class="input input-bordered w-full"
          [value]="product().price"
          formControlName="price"
          [class.border-red-500]="detailsForm.get('price')?.errors ?? false"
        />
        <form-error-label [control]="detailsForm.get('price')!" />
      </div>

      <div>
        <input
          type="number"
          placeholder="Inventario"
          class="input input-bordered w-full"
          [value]="product().stock"
          formControlName="stock"
          [class.border-red-500]="detailsForm.get('stock')?.errors ?? false"
        />
        <form-error-label [control]="detailsForm.get('stock')!" />
      </div>
    </div>

    <!-- tags -->
    <input type="text" placeholder="Tags" class="input input-bordered w-full"
        [value]="product().tags"
        formControlName="tags" />

    <!-- Botones para el género -->
    <div class="grid grid-cols-4 gap-2">
      <!-- <button class="btn btn-sm btn-outline">Masculino</button> -->
      <button
        class="btn btn-sm" type="button"
        [class.btn-primary]="detailsForm.value.gender === 'men'"
        (click)="detailsForm.patchValue({ gender: 'men'})"
        >Masculino</button>
      <button
        class="btn btn-sm" type="button"
        [class.btn-accent]="detailsForm.value.gender === 'women'"
        (click)="detailsForm.patchValue({ gender: 'women'})"
        >Femenino</button>
      <button
        class="btn btn-sm" type="button"
        [class.btn-warning]="detailsForm.value.gender === 'kid'"
        (click)="detailsForm.patchValue({ gender: 'kid'})"
        >Kid</button>
      <button
        class="btn btn-sm" type="button"
        [class.btn-secondary]="detailsForm.value.gender === 'unisex'"
        (click)="detailsForm.patchValue({ gender: 'unisex'})"
        >Unisex</button>
    </div>

    <!-- <select class="select select-bordered w-full">
      <option value="male">Masculino</option>
      <option value="female">Femenino</option>
      <option value="unisex">Unisex</option>
    </select> -->

    <!-- Sizes -->
    <div class="grid grid-cols-6 gap-2">
      @for (size of sizes; track size) {
      <button
        class="btn btn-sm"
        type="button"
        [class.btn-secondary]="detailsForm.value.sizes?.includes(size)"
        (click)="onSizeChange(size)">{{ size }}</button>
      }
    </div>
  </div>

  <!-- Imágenes -->
  <div class="flex flex-col gap-2">
    <div class="flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->

        Guardar
      </button>
    </div>

    <product-carousel [images]="imagesToCarousel()" />

    <input
      type="file"
      class="file-input file-input-bordered w-full mt-4"
      multiple
      accept="image/*"
      (change)="onFileChange($event)"/>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
      @for (image of tempImages(); track image) {
        <img [src]="image" alt="temp image" class="w-full object-cover rounded-xl">
      }
    </div>
  </div>
</form>

@if (wasSaved()) {
  <div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fade-in">
    <span>Product saved successfully</span>
  </div>
}
